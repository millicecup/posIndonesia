# pubspec.yaml
name: jejakpos
description: "JejakPOS - aplikasi pendamping Museum POS Indonesia (Explore, Discover, Collect)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Lokasi & izin
  geolocator: ^13.0.2
  permission_handler: ^11.4.0

  # Peta denah 2D (CrsSimple + gambar overlay)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # QR scanner (kamera)
  mobile_scanner: ^6.0.2

  # Audio narasi & Mars Pos Indonesia
  just_audio: ^0.9.42

  # Penyimpanan lokal progres
  shared_preferences: ^2.3.3
  path_provider: ^2.1.6
  gal: ^2.3.3
  flutter_tts: ^4.2.5
  camera: 0.11.0+2

  # Computer vision: pengenalan pameran on-device (embedding MobileNetV3)
  tflite_flutter: ^0.11.0

  # --- Disiapkan untuk sprint berikutnya (sengaja di-comment agar build Sprint 1 ringan) ---
  # google_mlkit_barcode_scanning: ^0.13.0  # alternatif mobile_scanner
  # flutter_blue_plus: ^1.35.3              # PoC BLE beacon (PB05) - hanya perangkat fisik

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/pois/
    - assets/images/stamps/
    - assets/images/photo_studio/
    - assets/images/stamp_making/
    - assets/audio/
    - assets/map/
    - assets/models/
    - assets/qr/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 100
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 200
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 800
